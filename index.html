<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte CEDI v15.9 - Escalamiento Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        // FUNCIÓN OBLIGATORIA: Fuerza la actualización del .js en cada carga
        (function() {
            const script = document.createElement('script');
            const timestamp = new Date().getTime(); // Genera un ID único basado en el tiempo
            script.src = `datos_cedi.js?v=${timestamp}`;
            document.head.appendChild(script);
            console.log("Cargando datos con ID único para evitar caché:", timestamp);
        })();
    </script>

    <style>
        :root { --primary: #0f172a; --storage: #2563eb; --transport: #f59e0b; --aging: #8b5cf6; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 10px; color: var(--primary); margin: 0; }
        .slide { background: white; max-width: 1000px; margin: 15px auto; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); position: relative; overflow: hidden; }
        .logo-header { position: absolute; top: 15px; right: 15px; width: 140px; height: 60px; display: flex; align-items: center; justify-content: center; }
        .logo-header img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .controls { background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e2e8f0; display: inline-block; }
        h1 { font-size: 18px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; width: 60%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .chart-container { height: 240px; position: relative; width: 100%; }
        #master-tooltip { position: fixed; background: rgba(0,0,0,0.95); color: white; padding: 12px; border-radius: 8px; pointer-events: none; opacity: 0; z-index: 10000; font-size: 11px; min-width: 160px; max-width: 180px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .kpi-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .kpi-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; text-align: center; }
        /* Mejora visual del Bimestre con semáforo */
        .bimestre-card { grid-column: span 2; padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; border: 1px solid transparent; transition: all 0.3s; }
        .bg-verde { background: #dcfce7; border-color: #86efac; color: #166534; }
        .bg-rojo { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
        
        .kpi-val { display: block; font-size: 15px; font-weight: bold; }
        .up { color: #10b981; } .down { color: #ef4444; }
        select[multiple] { height: 60px; border: 1px solid #cbd5e1; font-size: 11px; width: 160px; }
        .pct-footer { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 15px; background: #f1f5f9; padding: 10px; border-radius: 8px; }
        .pct-v { font-size: 11px; font-weight: 800; color: var(--aging); display: block; text-align: center; }
        @media (max-width: 600px) { h1 { width: 100%; font-size: 16px; margin-top: 50px; } .logo-header { width: 110px; } }
    </style>
</head>
<body>
    <div id="master-tooltip"></div>
    <div id="slides-dinamicos"></div>
    <div class="slide">
        <div class="logo-header"><img src="Logos_unidos.png" onerror="this.style.display='none'"></div>
        <h1>Antigüedad de Inventario</h1>
        <div class="controls"><select id="s4_range" multiple onchange="updateAging()"></select></div>
        <div class="grid">
            <div class="block"><h3>Moderno</h3><div class="chart-container"><canvas id="c4_mod"></canvas></div><div class="pct-footer" id="pct_mod_f"></div></div>
            <div class="block"><h3>Tradicional</h3><div class="chart-container"><canvas id="c4_trad"></canvas></div><div class="pct-footer" id="pct_trad_f"></div></div>
        </div>
    </div>

<script>
const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const num = new Intl.NumberFormat('en-US');
const masterTooltip = document.getElementById('master-tooltip');
let charts = {};

// Re-generar Slides 1-3
const titulos = ["Consolidado Compañía", "Canal Moderno", "Canal Tradicional"];
let htmlS = "";
titulos.forEach((t, i) => {
    const n = i+1;
    htmlS += `<div class="slide"><div class="logo-header"><img src="Logos_unidos.png" onerror="this.style.display='none'"></div><h1>${t}</h1><div class="controls"><select id="s${n}_mes" multiple onchange="updateView(${n})"></select></div><div class="grid"><div class="block"><h3>Almacenamiento</h3><div class="chart-container"><canvas id="c${n}_s"></canvas></div><div id="kpi_s${n}_s" class="kpi-container"></div></div><div class="block"><h3>Transporte</h3><div class="chart-container"><canvas id="c${n}_t"></canvas></div><div id="kpi_s${n}_t" class="kpi-container"></div></div></div></div>`;
});
document.getElementById('slides-dinamicos').innerHTML = htmlS;

function initApp() {
    // Verificación de carga de datos
    if (typeof data_cedi === 'undefined') {
        setTimeout(initApp, 500); // Re-intenta en medio segundo si el script no ha cargado
        return;
    }
    
    for(let i=1; i<=3; i++) {
        const sel = document.getElementById(`s${i}_mes`);
        data_cedi.config.meses_disponibles.forEach(m => sel.add(new Option(m, m, true, true)));
        charts[`c${i}s`] = makeChart(`c${i}_s`, `s${i}`, 's', '#2563eb', false);
        charts[`c${i}t`] = makeChart(`c${i}_t`, `s${i}`, 't', '#f59e0b', false);
        renderKPIs(i);
    }
    initAging();
}

function makeChart(id, sk, type, color, isAging) {
    return new Chart(document.getElementById(id), {
        type: 'bar',
        data: { labels: isAging ? data_cedi.aging.ranges : data_cedi.labels, datasets: [{ data: isAging ? data_cedi.aging[sk].v : data_cedi[sk][type], backgroundColor: color }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: false, tooltip: false }, onHover: (e, el) => handleHover(e, el, sk, type, isAging) }
    });
}

function handleHover(event, activeElements, sk, type, isAging) {
    if (activeElements.length > 0) {
        const i = activeElements[0].index;
        masterTooltip.style.opacity = 1;
        let posX = event.native.clientX + 10;
        let posY = event.native.clientY + 10;
        if (posX + 180 > window.innerWidth) posX = event.native.clientX - 195;
        masterTooltip.style.left = posX + 'px';
        masterTooltip.style.top = posY + 'px';

        if (isAging) {
            const d = data_cedi.aging[sk];
            masterTooltip.innerHTML = `<strong>${data_cedi.aging.ranges[i]}</strong><br>Valor: ${fmt.format(d.v[i])}<br>Cant: ${num.format(d.q[i])}<br><span style="color:#fbbf24">Obs: ${d.o[i]}</span>`;
        } else {
            const d = data_cedi[sk];
            masterTooltip.innerHTML = `<strong>${data_cedi.labels[i]}</strong><br>Valor: ${fmt.format(d[type][i])}<br>${type==='s'?'Posiciones':'Pedidos'}: ${num.format(d[type==='s'?'p':'d'][i])}`;
        }
    } else { masterTooltip.style.opacity = 0; }
}

function renderKPIs(n) {
    ['s', 't'].forEach(type => {
        const d = data_cedi.kpis[`s${n}`][type];
        // LÓGICA DE COLOR PARA BIMESTRE
        const colorClase = d.bim >= 0 ? 'bg-verde' : 'bg-rojo';
        
        document.getElementById(`kpi_s${n}_${type}`).innerHTML = `
            <div class="kpi-card"><span>MoM</span><br><b class="${d.mom >= 0?'up':'down'}">${d.mom}%</b></div>
            <div class="kpi-card"><span>YoY</span><br><b class="${d.yoy >= 0?'up':'down'}">${d.yoy}%</b></div>
            <div class="bimestre-card ${colorClase}">Bimestre YoY: ${d.bim}%</div>`;
    });
}

function initAging() {
    const sel = document.getElementById('s4_range');
    data_cedi.aging.ranges.forEach((r, i) => sel.add(new Option(r, i, true, true)));
    charts['c4mod'] = makeChart('c4_mod', 'mod', 'v', '#8b5cf6', true);
    charts['c4trad'] = makeChart('c4_trad', 'trad', 'v', '#8b5cf6', true);
    calcPct();
}

function updateView(n) {
    const sel = Array.from(document.getElementById(`s${n}_mes`).selectedOptions).map(o => o.value);
    let l = [], sD = [], tD = [];
    data_cedi.config.meses_nombres.forEach((m, i) => { if(sel.includes(m)) { l.push(data_cedi.labels[i]); sD.push(data_cedi[`s${n}`].s[i]); tD.push(data_cedi[`s${n}`].t[i]); } });
    charts[`c${n}s`].data.labels = l; charts[`c${n}s`].data.datasets[0].data = sD; charts[`c${n}s`].update();
    charts[`c${n}t`].data.labels = l; charts[`c${n}t`].data.datasets[0].data = tD; charts[`c${n}t`].update();
}

function updateAging() {
    const sel = Array.from(document.getElementById('s4_range').selectedOptions).map(o => parseInt(o.value));
    ['mod', 'trad'].forEach(c => { charts[`c4${c}`].data.datasets[0].data = data_cedi.aging[c].v.map((v, i) => sel.includes(i) ? v : 0); charts[`c4${c}`].update(); });
}

function calcPct() {
    ['mod', 'trad'].forEach(c => {
        const tot = data_cedi.aging[c].v.reduce((a,b)=>a+b,0);
        document.getElementById(`pct_${c}_f`).innerHTML = data_cedi.aging[c].v.map((v, i) => `<div class="pct-item"><span>${data_cedi.aging.ranges[i]}</span><br><b style="color:var(--aging)">${((v/tot)*100).toFixed(1)}%</b></div>`).join('');
    });
}
window.onload = initApp;
</script>
</body>
</html>
